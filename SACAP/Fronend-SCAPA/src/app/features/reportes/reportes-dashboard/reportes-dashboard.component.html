<div class="dashboard-container">
  <header class="dashboard-header">
    <div>
      <h1 class="page-title">Centro de Inteligencia y Reportes</h1>
      <p class="page-desc">Visualiza y analiza el desempeño del sistema según tus permisos.</p>
    </div>
  </header>

  <div class="categories-wrapper">
    <div *ngFor="let cat of categorias" class="category-section">
      <h2 class="category-title">{{ cat.nombre }}</h2>
      <div class="cards-grid">
        <a *ngFor="let link of cat.links" [routerLink]="['/admin/reportes', link.categoria, link.id]" class="report-card">
          <div class="card-icon">
            <lucide-icon [name]="link.icon" class="w-6 h-6"></lucide-icon>
          </div>
          <div class="card-content">
            <h3 class="card-title">{{ link.titulo }}</h3>
            <p class="card-desc">{{ link.descripcion }}</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
