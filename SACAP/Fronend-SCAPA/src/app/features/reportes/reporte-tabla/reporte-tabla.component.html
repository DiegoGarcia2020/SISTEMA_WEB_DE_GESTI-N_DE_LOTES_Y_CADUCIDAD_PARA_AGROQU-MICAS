<div class="table-container custom-scrollbar">
  <div *ngIf="loading" class="empty-state">
    <p>Cargando datos...</p>
  </div>
  
  <div *ngIf="!loading && data.length === 0" class="empty-state">
    <p>No se encontraron resultados para los filtros seleccionados.</p>
  </div>

  <table *ngIf="!loading && data.length > 0" class="data-table">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ formatHeader(col) }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of paginatedData">
        <td *ngFor="let col of columns" [ngClass]="{'text-right': isNumber(row[col])}">
          <ng-container *ngIf="isNumber(row[col]); else textData">
            <!-- Si la columna sugiere que es moneda o cantidad decimal, formatear -->
            <span *ngIf="col.toLowerCase().includes('total') || col.toLowerCase().includes('ganancia') || col.toLowerCase().includes('descuento') || col.toLowerCase().includes('precio'); else justNumber">
              ${{ row[col] | number:'1.2-2' }}
            </span>
            <ng-template #justNumber>
              {{ row[col] | number:'1.0-2' }}
            </ng-template>
          </ng-container>
          <ng-template #textData>
            <ng-container *ngIf="isDateColumn(col); else plainText">
              {{ row[col] | date:'shortDate' }}
            </ng-container>
            <ng-template #plainText>
              {{ row[col] }}
            </ng-template>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && totalPages > 1" class="pagination-controls" style="display: flex; justify-content: center; align-items: center; gap: 1rem; padding: 1rem 0; font-size: 0.875rem;">
    <button class="btn btn-sm btn-secondary" [disabled]="currentPage === 1" (click)="prevPage()" style="padding: 0.25rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 4px; cursor: pointer;">← Anterior</button>
    <span>Página {{ currentPage }} de {{ totalPages }} ({{ data.length }} registros)</span>
    <button class="btn btn-sm btn-secondary" [disabled]="currentPage === totalPages" (click)="nextPage()" style="padding: 0.25rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 4px; cursor: pointer;">Siguiente →</button>
  </div>
</div>
