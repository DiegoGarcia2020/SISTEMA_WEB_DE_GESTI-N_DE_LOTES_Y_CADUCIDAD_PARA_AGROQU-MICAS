server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad -- mitigan clickjacking (X-Frame-Options), MIME-sniffing
    # (X-Content-Type-Options), fuga de URLs a terceros (Referrer-Policy) e inyección de
    # scripts externos (CSP). connect-src incluye la URL del backend vía variable de
    # entorno reemplazada en build/entrypoint; en dev local apunta a localhost:8080.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8080 https://api.cloudinary.com; frame-ancestors 'none'" always;

    # Rutas de Angular (SPA): cualquier ruta que no sea un archivo real
    # cae a index.html para que el router del navegador la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachear los assets con hash en el nombre (JS/CSS de build) fuerte;
    # index.html nunca se cachea para que un despliegue nuevo se vea al instante.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
