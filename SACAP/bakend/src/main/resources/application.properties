spring.application.name=sacpa
server.port=8080

# URL publica del frontend, para armar enlaces (ej. el QR de ubicaciones
# apunta aqui en vez de codificar JSON crudo). En Docker se sobreescribe
# con la URL real de despliegue.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}


# ============================================================
# DATASOURCE — usuario de aplicacion (permisos restringidos por rol BD)
# Valores reales SOLO por variable de entorno — nunca hardcodeados aqui.
# Para desarrollo local exporta estas variables (ver .env.example en la raiz)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SCAPAV2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=seguridad
spring.jpa.open-in-view=false

# ============================================================
# LOGGING
# ============================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.uteq.sacpa.aspect=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# ============================================================
# MULTIPART — documentos adjuntos a lotes
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.devtools.restart.enabled=false

# ============================================================
# CLOUDINARY — documentos del lote
# ============================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ============================================================
# MAIL — notificaciones de alertas
# La contrasena de aplicacion de Gmail vive SOLO en la variable de entorno.
# La que estaba aqui antes quedo expuesta en el historial de git publico:
# revocala en https://myaccount.google.com/apppasswords y genera una nueva.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# JWT
# El secreto anterior quedo expuesto en el historial de git publico y ya
# no debe usarse. El valor real solo vive en la variable de entorno JWT_SECRET
# (ver .env.example). Sin esa variable definida, el arranque falla a proposito.
# ============================================================
jwt.secret=${JWT_SECRET}

# ============================================================
# IA EXTERNA — Motor de Sugerencias (solo redacta texto, ver
# MotorSugerenciaIAServiceImpl). Sin key configurada cae al texto
# deterministico, no rompe el arranque.
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
groq.api.key=${GROQ_API_KEY:}